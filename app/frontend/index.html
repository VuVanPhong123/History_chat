<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History ChatBot - AI Trợ lý Lịch sử Việt Nam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 History ChatBot</h1>
            <p>AI Trợ lý chuyên về Lịch sử Việt Nam</p>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span>Đang kết nối...</span>
            </div>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <div class="message-content">
                        Xin chào! Tôi là trợ lý AI chuyên về lịch sử Việt Nam. 
                        Hãy hỏi tôi bất kỳ câu hỏi nào về lịch sử Việt Nam!
                    </div>
                    <div class="message-time" id="currentTime"></div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="input-group">
                    <input type="text" id="questionInput" 
                           placeholder="Hỏi về lịch sử Việt Nam... (Ví dụ: Vua Quang Trung là ai?)"
                           maxlength="500">
                    <button id="sendButton" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="char-count" id="charCount">0/500</span>
                    <span class="examples">
                        Ví dụ: 
                        <span class="example" onclick="setExample('Vua Quang Trung đánh quân Thanh năm nào?')">Trận Ngọc Hồi</span>, 
                        <span class="example" onclick="setExample('Trận Điện Biên Phủ diễn ra khi nào?')">Điện Biên Phủ</span>,
                        <span class="example" onclick="setExample('Vai trò của Lê Lợi trong khởi nghĩa Lam Sơn?')">Lê Lợi</span>
                    </span>
                </div>
            </div>
        </div>

        <div class="session-info">
            <div class="session-id">Session: <span id="sessionId">...</span></div>
            <button onclick="newSession()" class="new-session-btn">🎯 Phiên mới</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
